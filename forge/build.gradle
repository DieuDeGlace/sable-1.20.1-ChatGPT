                'dev/ryanhcode/sable/neoforge/mixin/dynamic_directional_shading/ChunkRenderRebuildTaskMixin': [
                        compile: 'Lnet/minecraft/client/renderer/chunk/ChunkRenderDispatcher$RenderChunk$RebuildTask;m_234467_(FFFLnet/minecraft/client/renderer/ChunkBufferBuilderPack;)Lnet/minecraft/client/renderer/chunk/ChunkRenderDispatcher$RenderChunk$RebuildTask$CompileResults;'
                ],
