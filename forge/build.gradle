                (nativeLevelRendererMixin): [
                        allChanged: 'Lnet/minecraft/client/renderer/LevelRenderer;m_109818_()V',
                        renderLevel: 'Lnet/minecraft/client/renderer/LevelRenderer;m_109599_(Lcom/mojang/blaze3d/vertex/PoseStack;FJZLnet/minecraft/client/Camera;Lnet/minecraft/client/renderer/GameRenderer;Lnet/minecraft/client/renderer/LightTexture;Lorg/joml/Matrix4f;)V',
                        'Lnet/minecraft/client/renderer/LevelRenderer;globalBlockEntities:Ljava/util/Set;': 'Lnet/minecraft/client/renderer/LevelRenderer;f_109468_:Ljava/util/Set;',
                        'Lnet/minecraft/client/renderer/DimensionSpecialEffects;constantAmbientLight()Z': 'Lnet/minecraft/client/renderer/DimensionSpecialEffects;m_108885_()Z',
