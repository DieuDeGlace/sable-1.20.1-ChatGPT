tasks.named('compileCp2ProbeJava', JavaCompile) {
    description = 'Compiles the preserved full source tree without admitting it to the CP2-A runtime artifact.'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

tasks.named('compileCp2CoreProbeJava', JavaCompile) {
    description = 'Compiles the CP2 server/core source boundary without client rendering, mixins or optional compatibility.'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

tasks.named('compileM1CoreProbeJava', JavaCompile) {
    description = 'Compiles the M1 core, network, client-container and baseline-render dependency closure.'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true
    setAccessTransformers('src/port/resources/META-INF/accesstransformer.cfg')
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    mods {
        sable {
            sourceSet(sourceSets.main)
        }
        sable_validation {
            sourceSet(sourceSets.validation)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'mixin.debug.export', 'true'
            programArgument('-mixin.config=sable.mixins.json')
            programArgument('-mixin.config=sable-create.mixins.json')
            programArgument('-mixin.config=sable-forge.mixins.json')
            programArgument('-mixin.config=sable.validation.mixins.json')
            // ModDevGradle keeps non-module libraries for a run in this dedicated
            // configuration. Veil's slim artifact does not carry Molang Compiler.
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create('gg.moonflower:molang-compiler:3.1.1.19'))
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create('at.yawk.lz4:lz4-java:1.11.0'))
        }
        client {
            client()
            gameDirectory = project.file('run/client')
            if (project.hasProperty('sableDisableVeilImGui')) {
                // Veil 1.0.0.296 reads this exact system property in
                // foundry.veil.Veil before selecting its inactive ImGui backend.
                systemProperty 'veil.disableImgui', 'true'
            }
            if (project.hasProperty('sableTestServer')) {
                systemProperty 'sable.syncValidation', 'true'
                if (project.hasProperty('sableM2Validation')) {
                    systemProperty 'sable.m2Validation', 'true'
                }
                if (project.hasProperty('sableM3Validation')) {
                    systemProperty 'sable.m2Validation', 'true'
                    systemProperty 'sable.m3Validation', 'true'
                }
                if (project.hasProperty('sablePunchValidation')) {
                    systemProperty 'sable.m2Validation', 'true'
                    systemProperty 'sable.punchValidation', 'true'
                }
                if (project.hasProperty('sableFreezeValidation')) {
                    systemProperty 'sable.m2Validation', 'true'
                    systemProperty 'sable.freezeValidation', 'true'
                }
                if (project.hasProperty('sableMovementValidation')) {
                    systemProperty 'sable.m2Validation', 'true'
                    systemProperty 'sable.movementValidation', 'true'
                }
                if (project.hasProperty('sableRidingValidation')) {
                    systemProperty 'sable.m2Validation', 'true'
                    systemProperty 'sable.ridingValidation', 'true'
                }
                if (project.hasProperty('sableGizmoValidation')) {
                    systemProperty 'sable.m2Validation', 'true'
                    systemProperty 'sable.gizmoValidation', 'true'
                }
                if (project.hasProperty('sableWrongDirectionValidation')) {
                    systemProperty 'sable.wrongDirectionValidation',
                            project.property('sableWrongDirectionValidation').toString()
                }
                if (project.hasProperty('sableGizmoEnterValidation')) {
                    systemProperty 'sable.gizmoEnterValidation', 'true'
                }
                if (project.hasProperty('sableUdpValidation')) {
                    systemProperty 'sable.udpValidation', 'true'
                }
                programArgument('--quickPlayMultiplayer')
                programArgument(project.property('sableTestServer').toString() + ':'
                        + (project.findProperty('sableTestPort')?.toString() ?: '25566'))
            }

            def imguiLwjgl = project.dependencies.create(
                    'io.github.spair:imgui-java-lwjgl3:1.86.11')
            imguiLwjgl.exclude group: 'org.lwjgl'
            imguiLwjgl.exclude group: 'org.lwjgl.lwjgl'

            [
                    project.dependencies.create('io.github.spair:imgui-java-binding:1.86.11'),
                    imguiLwjgl,
                    project.dependencies.create('io.github.spair:imgui-java-natives-windows:1.86.11')
            ].each { dependency ->
                additionalRuntimeClasspathConfiguration.dependencies.add(dependency)
            }

            [
                    'org.lwjgl:lwjgl-opencl:3.3.1',
                    'org.lwjgl:lwjgl-shaderc:3.3.1',
                    'org.lwjgl:lwjgl-shaderc:3.3.1:natives-windows'
            ].each { notation ->
                def dependency = project.dependencies.create(notation)
                dependency.transitive = false
                additionalRuntimeClasspathConfiguration.dependencies.add(dependency)
            }
        }
        server {
            server()
            gameDirectory = project.hasProperty('sableM4RunDir')
                    ? project.file(project.property('sableM4RunDir'))
                    : project.file('run/server')
            if (project.hasProperty('sableM2Validation')) {
                systemProperty 'sable.m2Validation', 'true'
            }
            if (project.hasProperty('sableM3Validation')) {
                systemProperty 'sable.m2Validation', 'true'
                systemProperty 'sable.m3Validation', 'true'
            }
            if (project.hasProperty('sablePunchValidation')) {
                systemProperty 'sable.m2Validation', 'true'
                systemProperty 'sable.punchValidation', 'true'
            }
            if (project.hasProperty('sableFreezeValidation')) {
                systemProperty 'sable.m2Validation', 'true'
                systemProperty 'sable.freezeValidation', 'true'
            }
            if (project.hasProperty('sableMovementValidation')) {
                systemProperty 'sable.m2Validation', 'true'
                systemProperty 'sable.movementValidation', 'true'
            }
            if (project.hasProperty('sableRidingValidation')) {
                systemProperty 'sable.m2Validation', 'true'
                systemProperty 'sable.ridingValidation', 'true'
            }
            if (project.hasProperty('sableGizmoValidation')) {
                systemProperty 'sable.m2Validation', 'true'
                systemProperty 'sable.gizmoValidation', 'true'
            }
            if (project.hasProperty('sableWrongDirectionValidation')) {
                systemProperty 'sable.wrongDirectionValidation',
                        project.property('sableWrongDirectionValidation').toString()
            }
            if (project.hasProperty('sableGizmoEnterValidation')) {
                systemProperty 'sable.gizmoEnterValidation', 'true'
            }
            if (project.hasProperty('sableUdpValidation')) {
                systemProperty 'sable.udpValidation', 'true'
            }
            if (project.hasProperty('sableM4ValidationPhase')) {
                systemProperty 'sable.m4ValidationPhase',
                        project.property('sableM4ValidationPhase').toString()
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.hasProperty('sableGameTestRunDir')
                    ? project.file(project.property('sableGameTestRunDir'))
                    : project.file('run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', 'sable'
        }
    }
}

tasks.register('validationJar', Jar) {
    description = 'Builds the development-only Sable validation mod; never embedded in the production JAR.'
    archiveClassifier = 'validation'
    from sourceSets.validation.output
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    maven { url = 'https://maven.ryanhcode.dev/releases' }
}

dependencies {
    mixinMappingsAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.apache.maven:maven-artifact:3.8.5'
    implementation 'org.joml:joml:1.10.5'

    veilSlim("foundry.veil:Veil-forge-${minecraft_version}:${veil_version}:slim") {
        transitive = false
    }
    // The published Veil mixin is SRG-named. The task output is a development
    // dependency only; it is not nested into Sable's production jar.
    implementation(files(patchVeilForNamedDev))
    // Veil's Forge runtime artifact is the slim jar and its launcher metadata
    // normally supplies Molang. Manual Forge/HMCL installs do not consume that
    // metadata, so make the mandatory compiler available as a JarJar library.
    implementation(jarJar('gg.moonflower:molang-compiler:3.1.1.19'))
    implementation(jarJar('io.github.spair:imgui-java-binding:1.86.11'))
    implementation(jarJar('io.github.spair:imgui-java-lwjgl3:1.86.11'))
    implementation(jarJar('io.github.spair:imgui-java-natives-windows:1.86.11'))
    implementation(jarJar('at.yawk.lz4:lz4-java:1.11.0'))

    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")

    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.5.3'))
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def props = [
            version: rootProject.version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_author: mod_author,
            credits: credits,
            description: project.findProperty('description'),
            license: license,
            issues: issues,
            minecraft_version_range: minecraft_version_range,
            forge_loader_version_range: forge_loader_version_range,
            create_version_range: '[6.0.8,6.1.0)'
    ]
    inputs.properties(props)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title': mod_name,
                'Specification-Vendor': mod_author,
                'Specification-Version': rootProject.version,
                'Implementation-Title': 'sable-forge',
                'Implementation-Version': rootProject.version,
                'Implementation-Vendor': mod_author,
                'Built-On-Minecraft': minecraft_version,
                'MixinConfigs': 'sable.mixins.json,sable-create.mixins.json,sable-forge.mixins.json'
        ])
    }
}
