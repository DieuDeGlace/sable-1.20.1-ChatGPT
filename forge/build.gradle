            exclude { element ->
                def path = element.file.path.replace('\\', '/')
                path.contains('/mixinhelpers/compatibility/')
                        && !path.contains('/mixinhelpers/compatibility/create/')
                        && !path.contains('/mixinhelpers/compatibility/flywheel/')
