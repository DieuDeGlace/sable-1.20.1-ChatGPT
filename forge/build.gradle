            nativeRenderMappings.each { owner, required ->
                def actual = section[owner]
                required.each { name, expected ->
                    if (actual == null || actual[name] != expected) {
                        throw new GradleException("Missing or incorrect native-render SRG mapping for ${owner}.${name}: ${actual == null ? null : actual[name]}")
                    }
                }
            }
        }

        def output = mergedSableRefmap.get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(base)) + System.lineSeparator()
    }
}

