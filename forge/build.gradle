        // private lambda and calls the obfuscated BlockPos method in production.
        // All 24 packet subclasses depend on this single selector remaining valid.
        def createConfigurationMixin = 'dev/ryanhcode/sable/neoforge/mixin/compatibility/create/configuration/BlockEntityConfigurationPacketMixin'
        def createConfigurationRangeSelector = 'Lnet/minecraft/core/BlockPos;closerThan(Lnet/minecraft/core/Vec3i;D)Z'
        def createConfigurationRangeMapping = 'Lnet/minecraft/core/BlockPos;m_123314_(Lnet/minecraft/core/Vec3i;D)Z'
        [base.mappings[createConfigurationMixin], base.data.searge[createConfigurationMixin]].each { actual ->
            if (actual == null || actual[createConfigurationRangeSelector] != createConfigurationRangeMapping) {
