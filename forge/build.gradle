tasks.named('compileJava') {
    // The selective mixin filter changes membership inside a shared common source
    // root; a full javac pass prevents Gradle from pruning unchanged admitted
    // mixin classes during an incremental compile.
    options.incremental = false
    // Target-only plot tick policy lives at its real package path and must be
    // present in the production compiler input, not only the refmap source set.
    source file('src/port/java/dev/ryanhcode/sable/mixin/plot/LevelBlockEntityTickPolicyMixin.java')
    // Optional Embeddium target adapter must be present in the production
    // compiler input even though the shared mixin source filter is selective.
    source file('src/port/java/dev/ryanhcode/sable/mixin/sublevel_render/impl/embeddium/EmbeddiumDirtyBridgeMixin.java')
    // 1.20.1 port of upstream's Sodium reach-around dispatcher. The common
    // 1.21 implementation is excluded because its SectionRenderDispatcher API
    // does not exist on this target.
    source file('src/port/java/dev/ryanhcode/sable/sublevel/render/dispatcher/ReachAroundSubLevelRenderDispatcher.java')
    // Create 1.20.1 generators need reactivation after the bulk-move network clear.
    source file('src/port/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/kinetic_refresh/KineticBlockMixin.java')
    // 1.20.1 equivalents of upstream's two LevelRenderer hooks. These draw
    // before ShaderInstance.clear(), preserving the active vanilla lightmap.
    source fileTree('src/port/java') {
        include 'dev/ryanhcode/sable/mixin/port/sublevel_render/**'
    }
    // Dynamic directional shading is selected by the active mixin configs but
    // lives below nested source roots. Add the exact production files so they
    // cannot exist only in the refmap compiler output.
    source fileTree('../common/src/main/java') {
        include 'dev/ryanhcode/sable/mixin/dynamic_directional_shading/AmbientOcclusionFaceMixin.java'
        include 'dev/ryanhcode/sable/mixin/dynamic_directional_shading/ModelBlockRendererMixin.java'
