            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/airflow'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixinhelper/compatibility/create'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixinterface/compatibility/create'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/compatibility/flywheel'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/flywheel'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixinhelper/compatibility/flywheel'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixinterface/compatibility/flywheel'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/physics/callback'
            srcDir '../sable_companion/src/main/java'
            srcDir '../sable_rapier/src/main/java'
            exclude '**/sublevel/water_occlusion/ClientWaterOcclusionContainer.java'
            // Keep verified upstream groups at their original paths so later
            // Sable updates remain diffable; target-adapted mixins live under
            // forge/src/port/java/dev/ryanhcode/sable/admitted.
            exclude { element ->
                def path = element.file.path.replace('\\', '/')
                def selectedCreate = path.contains('/neoforge/mixin/compatibility/create/')
                        || path.contains('/neoforge/mixinhelper/compatibility/create/')
                        || path.contains('/neoforge/mixinterface/compatibility/create/')
                        || path.contains('/neoforge/mixin/admitted/')
                selectedCreate = selectedCreate && !path.endsWith('/neoforge/mixin/compatibility/create/flywheel/FlywheelBlockEntityMixin.java')
                selectedCreate = selectedCreate
                        || path.contains('/neoforge/compatibility/flywheel/')
                        || path.contains('/neoforge/mixin/compatibility/flywheel/')
                        || path.contains('/neoforge/mixinhelper/compatibility/flywheel/')
                        || path.contains('/neoforge/mixinterface/compatibility/flywheel/')
                selectedCreate = selectedCreate || path.contains('/neoforge/mixin/compatibility/create/fans_provide_force/')
                        || path.contains('/neoforge/mixin/compatibility/create/sails_providing_lift/')
                        || path.contains('/neoforge/mixin/compatibility/create/impact/')
                        || path.endsWith('/neoforge/mixin/compatibility/create/belt/BeltBlockMixin.java')
                        || path.contains('/neoforge/mixin/compatibility/create/entity_falls_on_block/')
                        || path.endsWith('/neoforge/mixin/compatibility/create/chain_conveyor/ChainConveyorBlockMixin.java')
                        || path.endsWith('/neoforge/mixin/compatibility/create/display_link/DisplayLinkBlockMixin.java')
                        || path.contains('/neoforge/mixin/compatibility/create/turntable/')
                        || path.contains('/neoforge/mixin/compatibility/create/vertical_gearbox/')
                        || path.contains('/neoforge/mixin/compatibility/create/crushing_wheel/')
                        || path.endsWith('/neoforge/mixin/compatibility/create/airflow/AirCurrentMixin.java')
