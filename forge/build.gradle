                        || path.contains('/mixin/chunk_container_replacement/')
                        || path.contains('/mixin/command/') || path.contains('/mixin/conduit/')
                        || path.contains('/mixin/death_message/')
                        || path.contains('/mixin/entity/entity_aabb_lookup/')
                        || path.contains('/mixin/entity/entity_swimming/')
                        || path.contains('/mixin/entity/entity_unloading/')
                        || path.contains('/mixin/entity/teleport_players/')
                        || path.contains('/mixin/entity/entity_sublevel_collision/')
                        || path.contains('/mixin/extension/') || path.contains('/mixin/fluids_on_sub_levels/')
                        || path.contains('/mixin/impact/') || path.contains('/mixin/physics/')
                        || path.contains('/mixin/plot/') || path.contains('/mixin/portal/')
                        || path.contains('/mixin/prevent_freezing/') || path.contains('/mixin/prevent_overgrowth/')
                        || path.contains('/mixin/punching/') || path.contains('/mixin/sign_interaction/')
                        || path.contains('/mixin/sky_light_shadow/') || path.contains('/mixin/stop_lightning/')
                        || path.contains('/mixin/stop_rain/') || path.contains('/mixin/toast/')
                        || path.contains('/mixin/tracking_points/') || path.contains('/mixin/world_border/')
                        || path.contains('/mixin/player_standup/')
                def selectedTargetRenderAdapter = path.contains('/forge/src/port/java/dev/ryanhcode/sable/mixin/port/sublevel_render/')
                def excludedSource = path.endsWith('/mixin/entity/entity_aabb_lookup/ClientLevelMixin.java')
                        || path.endsWith('/mixin/interaction_distance/PlayerMixin.java')
