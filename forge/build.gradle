                        || path.contains('/neoforge/mixin/block_outline_render/')
                        || path.contains('/neoforge/mixin/entities_stick_sublevels/effects/')
                        || path.contains('/neoforge/mixin/sound/')
                        || path.contains('/neoforge/mixin/dynamic_directional_shading/')
