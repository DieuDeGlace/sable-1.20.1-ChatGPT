plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge'
}

configurations {
    veilSlim
}

def patchVeilForNamedDev = tasks.register('patchVeilForNamedDev', PatchVeilForNamedDev) {
    dependsOn tasks.named('createMinecraftArtifacts')
    inputJar = layout.file(configurations.veilSlim.elements.map { files ->
        if (files.size() != 1) {
            throw new GradleException("Expected one Veil slim artifact, found ${files.size()}")
        }
        files.iterator().next().asFile
    })
    mappings = layout.buildDirectory.file('moddev/artifacts/intermediateToNamed.srg')
    outputJar = layout.buildDirectory.file("devlibs/Veil-forge-${minecraft_version}-${veil_version}-named-dev.jar")
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = "sable-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets {
    main {
        java {
            setSrcDirs(['src/port/java', '../common/src/main/java'])
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/udp'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/entity/entity_rotations_and_riding'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/entity/entity_tracking'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/entity/entity_ai'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/entity/projectile'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/entity/tnt_jumps'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/entity/arrows_hit_blocks'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/entity/trident'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/entity/falling_block'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/entity/parrot'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/entity/entity_aabb_lookup'
