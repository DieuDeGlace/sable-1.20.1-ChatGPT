            exclude '**/mixinhelpers/block_outline_render/**'
            exclude '**/mixinhelpers/entity/sublevels_block_sky/**'
            exclude '**/mixinhelpers/entity/entity_rendering/shadows/**'
            exclude '**/config/SubLevelSettingsScreen.java'
        }
        resources {
            srcDir '../common/src/main/resources'
            srcDir '../sable_rapier/src/main/resources'
            exclude 'META-INF/accesstransformer.cfg'
            exclude 'META-INF/services/dev.ryanhcode.sable.platform.SableEventPlatform'
            exclude 'META-INF/services/dev.ryanhcode.sable.platform.SableEventPublishPlatform'
            exclude 'META-INF/services/dev.ryanhcode.sable.platform.SableSubLevelRenderPlatform'
            exclude '*.disabled'
            exclude 'fabric.mod.json'
        }
    }
    cp2Probe {
        java {
            setSrcDirs([
                    '../common/src/main/java',
                    '../sable_rapier/src/main/java',
                    'src/main/java'
            ])
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    cp2CoreProbe {
        java {
            setSrcDirs([
                    '../common/src/main/java',
                    '../sable_rapier/src/main/java'
            ])
            exclude '**/mixin/**'
            exclude '**/compatibility/**'
            exclude '**/sublevel/storage/debug/**'
            exclude '**/render/**'
            exclude '**/sound/**'
            exclude '**/debug/**'
            exclude '**/gametest/**'
            exclude '**/mixinhelper/**'
            exclude '**/mixinhelpers/**'
            exclude '**/mixinterface/sublevel_render/**'
            exclude '**/SableClient.java'
            exclude '**/SableClientConfig.java'
            exclude '**/config/SubLevelSettingsScreen.java'
            exclude '**/sublevel/ClientSubLevel.java'
            exclude '**/sublevel/water_occlusion/**'
            exclude '**/index/SableToasts.java'
            exclude '**/platform/SableSubLevelRenderPlatform.java'
            exclude '**/network/**'
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    m1CoreProbe {
        java {
            setSrcDirs([
                    '../common/src/main/java',
                    '../sable_rapier/src/main/java',
                    'src/m1CoreProbe/java'
            ])
            exclude '**/sublevel/water_occlusion/ClientWaterOcclusionContainer.java'
            exclude '**/mixin/**'
            exclude '**/compatibility/**'
            exclude '**/sublevel/storage/debug/**'
            exclude '**/gametest/**'
            exclude '**/sound/**'
            exclude '**/render/fancy/**'
            exclude '**/render/dynamic_shade/**'
            exclude '**/render/sky_light_shadow/**'
            exclude '**/render/water_occlusion/**'
            exclude '**/render/region/**'
            exclude '**/mixinhelpers/loaded_chunk_debug/**'
            exclude '**/mixinhelpers/block_outline_render/**'
            exclude '**/mixinhelpers/entity/sublevels_block_sky/**'
            exclude '**/mixinhelpers/entity/entity_rendering/shadows/**'
            exclude '**/config/SubLevelSettingsScreen.java'
            exclude '**/sublevel/render/dispatcher/FancySubLevelRenderDispatcher.java'
            exclude '**/sublevel/render/dispatcher/ReachAroundSubLevelRenderDispatcher.java'
            exclude '**/sublevel/render/dispatcher/SubLevelTextureCache.java'
            exclude '**/mixinhelper/compatibility/**'
            exclude '**/mixinhelpers/compatibility/**'
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    // M7 diagnostic boundary: compile the complete upstream Create/Flywheel
    // compatibility surface against the exact target dependencies without
    // allowing probe classes into the production JAR.
    m7CompatibilityProbe {
        java {
            setSrcDirs(['src/main/java'])
            include 'dev/ryanhcode/sable/neoforge/mixin/compatibility/create/**'
            include 'dev/ryanhcode/sable/neoforge/mixin/compatibility/flywheel/**'
            include 'dev/ryanhcode/sable/neoforge/mixinhelper/compatibility/create/**'
            include 'dev/ryanhcode/sable/neoforge/mixinhelper/compatibility/flywheel/**'
            include 'dev/ryanhcode/sable/neoforge/mixinterface/compatibility/**'
            include 'dev/ryanhcode/sable/neoforge/compatibility/flywheel/**'
            include 'dev/ryanhcode/sable/neoforge/physics/callback/**'
            // Known 1.21.1-only boundaries are excluded so one compile reveals
            // all remaining Create 6.0.8-compatible groups in a single pass.
            exclude 'dev/ryanhcode/sable/neoforge/mixin/compatibility/create/flywheel/FlywheelBlockEntityMixin.java'
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    // M6 diagnostic boundary: vanilla-only upstream mixins, isolated from
    // optional third-party integrations and production packaging.
    m6VanillaProbe {
        java {
            setSrcDirs(['../common/src/main/java'])
            include 'dev/ryanhcode/sable/mixin/**'
            include 'dev/ryanhcode/sable/sound/**'
            include 'dev/ryanhcode/sable/config/SubLevelSettingsScreen.java'
            include 'dev/ryanhcode/sable/mixinhelpers/entity/entity_rendering/shadows/**'
            include 'dev/ryanhcode/sable/mixinhelpers/entity/sublevels_block_sky/**'
            exclude 'dev/ryanhcode/sable/mixin/compatibility/**'
            exclude 'dev/ryanhcode/sable/mixin/game_test/**'
            exclude 'dev/ryanhcode/sable/mixin/AbstractSableMixinPlugin.java'
            exclude 'dev/ryanhcode/sable/mixin/debug_render/**'
            exclude 'dev/ryanhcode/sable/mixin/sublevel_render/impl/sodium/**'
            exclude 'dev/ryanhcode/sable/mixin/dynamic_directional_shading/**'
            exclude 'dev/ryanhcode/sable/mixin/entity/entity_pathfinding/PathfindingContextMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/entity/server_entities_tick/**'
            exclude 'dev/ryanhcode/sable/mixin/loaded_chunk_debug/**'
            exclude 'dev/ryanhcode/sable/mixin/recoil/**'
            exclude 'dev/ryanhcode/sable/mixin/sublevel_render/**'
            exclude 'dev/ryanhcode/sable/mixin/water_occlusion/**'
            exclude 'dev/ryanhcode/sable/mixin/plot/ClientChunkCacheMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/interaction_distance/PlayerMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/voxel_shape_iteration/VoxelShapeMixin.java'
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    validation {
        java.setSrcDirs(['src/validation/java'])
        resources.setSrcDirs(['src/validation/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Generate the additional SRG mappings needed for @Shadow members from only
// the active Minecraft-target mixins. Running the AP over Create/Flywheel
// targets incorrectly asks the Minecraft mapping set to rename third-party
// method names. The complete injection refmap is generated from the same
// official mapping input and checked in under src/port/resources.
def activeCommonMixins = new groovy.json.JsonSlurper()
        .parse(file('../common/src/main/resources/sable.mixins.json'))
        .with { (mixins ?: []) + (client ?: []) + (server ?: []) }
def activeForgeMixins = new groovy.json.JsonSlurper()
        .parse(file('src/main/resources/sable-forge.mixins.json'))
        .with { (mixins ?: []) + (client ?: []) + (server ?: []) }

sourceSets {
    mixinMappings {
        java {
            setSrcDirs(['../common/src/main/java', 'src/port/java', 'src/main/java'])
            activeCommonMixins.each { entry ->
                include "dev/ryanhcode/sable/mixin/${entry.replace('.', '/')}.java"
            }
            activeForgeMixins.each { entry ->
                include "dev/ryanhcode/sable/neoforge/mixin/${entry.replace('.', '/')}.java"
            }
            // Forge-only renderer adapters are kept in a path that makes their
            // target-version provenance explicit, while their Java package must
            // still match the upstream NeoForge mixin configuration. Include the
            // physical source path so the Mixin AP emits the SRG selectors used by
            // production Forge launches (the main source set alone is not enough).
            include 'dev/ryanhcode/sable/forge/adaptermixins/**'
            include 'dev/ryanhcode/sable/admitted/**'
            include 'support/**'
            // These 1.21 sources are replaced by same-package 1.20 adapters.
            exclude 'dev/ryanhcode/sable/mixin/command/ArgumentTypeInfosMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/block_properties/BlockStateMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/plot/ClientChunkCacheMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/plot/container/ClientLevelMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/plot/container/ServerLevelMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/plot/LevelChunkMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/plot/serialization/LevelChunkTicksMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/plot/MinecraftMixin.java'
            exclude 'dev/ryanhcode/sable/mixin/sublevel_render/RenderSectionAccessor.java'
            exclude 'dev/ryanhcode/sable/mixin/level_accelerator/ServerChunkCacheAccessor.java'
            exclude 'dev/ryanhcode/sable/mixin/plot/ServerChunkCacheMixin.java'
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

mixin {
    add sourceSets.mixinMappings, 'sable-common-shadow.refmap.json'
    config 'sable.mixins.json'
    config 'sable-create.mixins.json'
    config 'sable-forge.mixins.json'
}

def mergedSableRefmap = layout.buildDirectory.file('generated/sable-refmap/sable.refmap.json')

tasks.register('mergeSableRefmap') {
    dependsOn tasks.named('compileMixinMappingsJava')
    inputs.file('src/port/resources/sable.refmap.json')
    inputs.file(layout.buildDirectory.file('mixin/sable-common-shadow.refmap.json'))
    outputs.file(mergedSableRefmap)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def base = slurper.parse(file('src/port/resources/sable.refmap.json'))
        def generated = slurper.parse(layout.buildDirectory.file('mixin/sable-common-shadow.refmap.json').get().asFile)

        generated.each { section, entries ->
            if (entries instanceof Map) {
                def destination = base.computeIfAbsent(section) { [:] }
                entries.each { mixinClass, mappings ->
                    if (mappings instanceof Map) {
                        def mixinDestination = destination.computeIfAbsent(mixinClass) { [:] }
                        mixinDestination.putAll(mappings)
                    } else {
                        destination[mixinClass] = mappings
                    }
                }
            } else {
                base[section] = entries
            }
        }

        // ServerChunkCache loads while an integrated server creates or opens a
        // world. A missing SRG selector therefore bricks both paths before any
        // gameplay validation can run. Keep the complete target adapter mapping
        // as a production build invariant.
        def plotMixin = 'dev/ryanhcode/sable/mixin/plot/ServerChunkCacheMixin'
        def requiredPlotMappings = [
                getChunkNow             : 'Lnet/minecraft/server/level/ServerChunkCache;m_7131_(II)Lnet/minecraft/world/level/chunk/LevelChunk;',
                getChunkFutureMainThread: 'Lnet/minecraft/server/level/ServerChunkCache;m_8456_(IILnet/minecraft/world/level/chunk/ChunkStatus;Z)Ljava/util/concurrent/CompletableFuture;',
                hasChunk               : 'Lnet/minecraft/server/level/ServerChunkCache;m_5563_(II)Z',
                getChunkForLighting     : 'Lnet/minecraft/server/level/ServerChunkCache;m_6196_(II)Lnet/minecraft/world/level/chunk/LightChunk;',
                isPositionTicking       : 'Lnet/minecraft/server/level/ServerChunkCache;m_143239_(J)Z',
                getFullChunk            : 'Lnet/minecraft/server/level/ServerChunkCache;m_8370_(JLjava/util/function/Consumer;)V',
                getVisibleChunkIfPresent: 'Lnet/minecraft/server/level/ServerChunkCache;m_8364_(J)Lnet/minecraft/server/level/ChunkHolder;',
                addRegionTicket         : 'Lnet/minecraft/server/level/ServerChunkCache;m_8387_(Lnet/minecraft/server/level/TicketType;Lnet/minecraft/world/level/ChunkPos;ILjava/lang/Object;)V',
