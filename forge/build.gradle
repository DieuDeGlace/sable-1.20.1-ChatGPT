            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/interaction_distance'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixin/camera/camera_rotation'
            srcDir '../common/src/main/java/dev/ryanhcode/sable/mixinhelpers/block_outline_render'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/camera_rotation'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/block_outline_render'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/entities_stick_sublevels/effects'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/sound'
            // M7 Create 6.0.8 server/common compatibility batch. These are
            // unchanged upstream sources compiled from the preserved loader tree.
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/fans_provide_force'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/sails_providing_lift'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/impact'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/belt'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/entity_falls_on_block'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/chain_conveyor'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/display_link'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/turntable'
            srcDir 'src/main/java/dev/ryanhcode/sable/neoforge/mixin/compatibility/create/vertical_gearbox'
